name: Bug
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: input
    id: url
    attributes: { label: Page URL }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what you expected }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Browser and device, placeholder: "Firefox 131, Android" }
